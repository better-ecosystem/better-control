[project]
name = "better-control"
version = "7.0.0"
description = "A simple control panel for linux based on the GTK framework."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "RQuarx", email = "RQuarx@protonmail.com" },
    # add more...
]
requires-python = ">=3.14"
dependencies = [
    "argparse>=1.4.0",
    "dbus-python>=1.4.0",
    "psutil>=7.2.2",
    "pygobject>=3.58.0",
    "pygobject-stubs>=2.17.0",
    "qrcode>=8.2",
    "requests>=2.34.2",
    "result>=0.17.0",
    "setproctitle>=1.3.7",
]

[project.scripts]
better-control = "better_control:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
